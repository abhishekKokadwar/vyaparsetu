// ---------- svg helpers ----------
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const ctx = document.createElement('canvas').getContext('2d');

function T(x,y,s,o={}){
  const {size=20,w=400,fill=INK,font=SANS,anchor='start',ls=0,style=''}=o;
  return `<text x="${x}" y="${y}" font-family="${font}" font-size="${size}" font-weight="${w}" fill="${fill}" text-anchor="${anchor}" letter-spacing="${ls}" ${style}>${esc(s)}</text>`;
}
// wrapped text; **bold** spans supported. returns {svg, h}
function W(x,y,width,s,o={}){
  const {size=20,w=400,fill=INK,font=SANS,lh=1.35,bfill=fill}=o;
  const toks=[]; s.split('**').forEach((part,i)=>part.split(/(\s+)/).forEach(t=>{ if(t) toks.push({t,b:i%2===1}); }));
  const lines=[[]]; let cur=0;
  for(const k of toks){
    ctx.font=`${k.b?700:w} ${size}px ${font}`; const tw=ctx.measureText(k.t).width;
    if(/^\s+$/.test(k.t)){ if(lines.at(-1).length){ lines.at(-1).push(k); cur+=tw; } continue; }
    if(cur+tw>width && lines.at(-1).length){ while(lines.at(-1).length && /^\s+$/.test(lines.at(-1).at(-1).t)) lines.at(-1).pop(); lines.push([]); cur=0; }
    lines.at(-1).push(k); cur+=tw;
  }
  const L=size*lh;
  const svg=lines.map((ln,i)=>`<text x="${x}" y="${y+i*L}" font-family="${font}" font-size="${size}" fill="${fill}" xml:space="preserve">`+
     ln.map(k=>`<tspan font-weight="${k.b?700:w}" ${k.b?`fill="${bfill}"`:''}>${esc(k.t)}</tspan>`).join('')+`</text>`).join('');
  return {svg,h:lines.length*L};
}
const R=(x,y,w,h,o={})=>{const {fill='#fff',stroke='none',r=0,sw=1.5,dash='',op=1}=o;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" ${dash?`stroke-dasharray="${dash}"`:''} opacity="${op}"/>`;};
const C=(cx,cy,r,o={})=>{const {fill=INK,stroke='none',sw=2}=o; return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;};
const Ln=(x1,y1,x2,y2,o={})=>{const {stroke=LINE,sw=2,dash='',marker=''}=o;
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${sw}" ${dash?`stroke-dasharray="${dash}"`:''} ${marker?`marker-end="url(#${marker})"`:''}/>`;};
// card: white panel, thin border, optional left accent / hard offset shadow (bold-card look)
function card(x,y,w,h,o={}){

  return s;
}

const tick=(cx,cy,c=GREEN)=>C(cx,cy,11,{fill:c})+`<path d="M${cx-5} ${cy} l3.5 4 l6.5 -8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;

<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="${RED}"/></marker></defs>`;
